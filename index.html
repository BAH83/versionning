<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carte de Profil Moderne</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="profile-card">
            <div class="card-header">
                <div class="avatar">
                    <img src="https://via.placeholder.com/120x120/4CAF50/white?text=JD" alt="Avatar">
                </div>
                <h2>Jean Dupont</h2>
                <p class="title">Développeur Full Stack</p>
            </div>
            
            <div class="card-body">
                <div class="info-section">
                    <h3>À propos</h3>
                    <p>Passionné par le développement web et les nouvelles technologies. Expert en HTML, CSS, JavaScript et frameworks modernes.</p>
                </div>
                
                <div class="info-section">
                    <h3>Compétences</h3>
                    <div class="skills">
                        <span class="skill-tag">HTML5</span>
                        <span class="skill-tag">CSS3</span>
                        <span class="skill-tag">JavaScript</span>
                        <span class="skill-tag">React</span>
                        <span class="skill-tag">Node.js</span>
                        <span class="skill-tag">Python</span>
                    </div>
                </div>
                
                <div class="info-section">
                    <h3>Contact</h3>
                    <div class="contact-info">
                        <p>📧 jean.dupont@email.com</p>
                        <p>📱 +33 6 12 34 56 78</p>
                        <p>📍 Paris, France</p>
                    </div>
                </div>
            </div>
            
            <div class="card-footer">
                <button class="btn btn-primary">Contacter</button>
                <button class="btn btn-secondary">Portfolio</button>
            </div>
        </div>
    </div>
</body>
</html>
